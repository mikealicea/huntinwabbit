# This distinct service creates a separate stack from the original application.
org: ${env:SERVERLESS_ORG}
service: huntinwabbit-boilerplate
frameworkVersion: '4'
provider:
  name: aws
  runtime: nodejs24.x
  architecture: x86_64
  region: us-east-1
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
build:
  esbuild:
    sourcemap:
      type: linked
      setNodeOptions: true
    configFile: ./esbuild.config.mjs
functions:
  api:
    handler: src/lambda.handler
    timeout: 15
    memorySize: 256
    url: true
package:
  patterns:
    - '!**/.env*'
    - '!coverage/**'
    - '!e2e/**'
    - '!**/*.test.ts'
