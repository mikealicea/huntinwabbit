# Deployment identity for the huntinwabbit backend.
org: builtinspace
service: huntinwabbit

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: x86_64
  region: us-east-1
  environment:
    JOB_POSTINGS_TABLE: !Ref JobPostingsTable
    SUPABASE_URL: ${env:SUPABASE_URL}
    JOB_PARSING_ENABLED: ${env:JOB_PARSING_ENABLED, 'false'}
    REDPILL_API_KEY: ${env:REDPILL_API_KEY, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action: ['dynamodb:GetItem', 'dynamodb:Query']
          Resource: !GetAtt JobPostingsTable.Arn
        - Effect: Allow
          Action: ['dynamodb:PutItem']
          Resource: !GetAtt JobPostingsTable.Arn
          Condition:
            StringEquals:
              dynamodb:EnclosingOperation: TransactWriteItems

# v4 bundles src/ with built-in esbuild — handlers point at source, not build output.
# Reference: docs/SERVERLESS-V4.AGENTS.md
build:
  esbuild:
    external: ['@teng-lin/agent-fetch', '!@aws-sdk/*']
    sourcemap:
      type: linked
      setNodeOptions: true # readable TS stack traces in CloudWatch
    exclude: ['!@aws-sdk/*'] # Negate Serverless defaults to bundle the locked SDK.
    # ESM output + CJS deps (serverless-http, express) need a require shim.
    configFile: ./esbuild.config.mjs

functions:
  api:
    handler: src/lambda.handler
    timeout: 70
    memorySize: 1024
    url: true

resources:
  Resources:
    JobPostingsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${sls:stage}-job-postings
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        SSESpecification:
          SSEEnabled: true
