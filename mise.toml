[tools]
node = "24.18.0"
supabase = "2.111.0"

[tasks."auth:push"]
description = "Review and push configuration to your Supabase project"
run = '''
SUPABASE_PROJECT_REF="$(node --env-file-if-exists=supabase/.env -p 'process.env.SUPABASE_PROJECT_REF ?? ""')"
supabase config push --project-ref "${SUPABASE_PROJECT_REF:?Set SUPABASE_PROJECT_REF in supabase/.env or your shell}" --workdir .
'''

[tasks."docs:check"]
description = "Validate repository documentation"
run = "node --test scripts/documentation-structure.test.mjs && node scripts/check-documentation.mjs"
